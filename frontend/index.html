<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Browser chrome follows the active theme; the inline script below keeps
         this in sync with data-theme (approx of --color-paper per theme). -->
    <meta name="theme-color" content="#faf9f4" />
    <title>Fresha | Premier Salon Experience</title>
    <meta name="description" content="Discover and book top-rated salon services — hair, spa, skincare, nails and more. Browse partner salons, check live availability, and book with secure payments." />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fresha | Premier Salon Experience" />
    <meta property="og:description" content="Discover and book top-rated salon services — hair, spa, skincare, nails and more. Browse, check availability, and book securely." />
    <meta property="og:site_name" content="Fresha Salon" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fresha | Premier Salon Experience" />
    <meta name="twitter:description" content="Discover and book top-rated salon services. Browse, check availability, and book securely." />

    <!-- No flash of wrong theme: mirror ThemeContext's resolution exactly
         (localStorage 'theme', default 'light') before first paint, and keep
         the theme-color meta in sync whenever data-theme changes later
         (e.g. the Navbar toggle) without touching component code. -->
    <script>
      (function () {
        var LIGHT = '#faf9f4';
        var DARK = '#1a1715';
        var theme = 'light';
        try {
          var stored = localStorage.getItem('theme');
          if (stored === 'dark' || stored === 'light') theme = stored;
        } catch (e) { /* storage blocked — stay light */ }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        var sync = function () {
          var current = document.documentElement.getAttribute('data-theme');
          if (meta) meta.setAttribute('content', current === 'dark' ? DARK : LIGHT);
        };
        sync();
        if (window.MutationObserver) {
          new MutationObserver(sync).observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['data-theme']
          });
        }
      })();
    </script>

    <!-- Fonts: Inter (body) + Fraunces (display, optical-size axis) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Cashfree SDK for Payments -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
